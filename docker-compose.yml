services:
  slurmmonitor:
    build: .
    container_name: slurmmonitor
    ports:
      - "${HOST_PORT:-80}:8091"
    volumes:
      - ${SSH_DIR}:/ssh-host:ro
      - ./certs:/certs:ro
    environment:
      - SLURM_SSH_HOST=${SLURM_SSH_HOST:-disi}
      - REFRESH_INTERVAL_SECONDS=${REFRESH_INTERVAL_SECONDS:-20}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    restart: unless-stopped
